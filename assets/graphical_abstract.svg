<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">

  <defs>
    <linearGradient id="gcBrand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E63F25"/>
      <stop offset="1"   stop-color="#DE7226"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73A38B"/>
      <stop offset="1" stop-color="#486B5A"/>
    </linearGradient>
    <linearGradient id="bactGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#803348"/>
      <stop offset="1" stop-color="#4A1C28"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f76"/>
    </marker>
    <marker id="arrowBrand" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E63F25"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4a2e35" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#FFFDF9"/>

  <!-- ============ LEFT: THE PROBLEM ============ -->
  <text x="60" y="52" font-size="13" font-weight="700" fill="#a09488" letter-spacing="1.6">THE PROBLEM TODAY</text>
  <line x1="60" y1="64" x2="380" y2="64" stroke="#e6ded4" stroke-width="2"/>

  <!-- scattered papers -->
  <g filter="url(#soft)">
    <g transform="translate(72,92) rotate(-8)">
      <rect width="86" height="108" rx="4" fill="#fff" stroke="#d9cec2" stroke-width="1.5"/>
      <line x1="12" y1="20" x2="66" y2="20" stroke="#c9bdaf" stroke-width="3"/>
      <line x1="12" y1="34" x2="74" y2="34" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="45" x2="70" y2="45" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="56" x2="74" y2="56" stroke="#e3dad0" stroke-width="2.5"/>
      <text x="12" y="82" font-size="9.5" font-weight="700" fill="#B85C43">fimA I–V</text>
      <text x="12" y="95" font-size="8" fill="#a09488">1999, 2000</text>
    </g>
    <g transform="translate(178,84) rotate(5)">
      <rect width="86" height="108" rx="4" fill="#fff" stroke="#d9cec2" stroke-width="1.5"/>
      <line x1="12" y1="20" x2="66" y2="20" stroke="#c9bdaf" stroke-width="3"/>
      <line x1="12" y1="34" x2="74" y2="34" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="45" x2="70" y2="45" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="56" x2="74" y2="56" stroke="#e3dad0" stroke-width="2.5"/>
      <text x="12" y="82" font-size="9.5" font-weight="700" fill="#486B5A">mfa1–mfa5</text>
      <text x="12" y="95" font-size="8" fill="#a09488">2018, 2021, 2023</text>
    </g>
    <g transform="translate(80,214) rotate(4)">
      <rect width="86" height="108" rx="4" fill="#fff" stroke="#d9cec2" stroke-width="1.5"/>
      <line x1="12" y1="20" x2="66" y2="20" stroke="#c9bdaf" stroke-width="3"/>
      <line x1="12" y1="34" x2="74" y2="34" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="45" x2="70" y2="45" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="56" x2="74" y2="56" stroke="#e3dad0" stroke-width="2.5"/>
      <text x="12" y="82" font-size="9.5" font-weight="700" fill="#B85C43">rag-1…rag-4</text>
      <text x="12" y="95" font-size="8" fill="#a09488">1999, 2005</text>
    </g>
    <g transform="translate(186,222) rotate(-6)">
      <rect width="86" height="108" rx="4" fill="#fff" stroke="#d9cec2" stroke-width="1.5"/>
      <line x1="12" y1="20" x2="66" y2="20" stroke="#c9bdaf" stroke-width="3"/>
      <line x1="12" y1="34" x2="74" y2="34" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="45" x2="70" y2="45" stroke="#e3dad0" stroke-width="2.5"/>
      <line x1="12" y1="56" x2="74" y2="56" stroke="#e3dad0" stroke-width="2.5"/>
      <text x="12" y="82" font-size="9.5" font-weight="700" fill="#CBB175">K1–K7 cps</text>
      <text x="12" y="95" font-size="8" fill="#a09488">1998, 2006, 2010</text>
    </g>
  </g>

  <!-- bespoke script box -->
  <g transform="translate(60,350)">
    <rect width="322" height="94" rx="8" fill="#2A1B1F" filter="url(#soft)"/>
    <circle cx="18" cy="17" r="4" fill="#ff5f57"/>
    <circle cx="32" cy="17" r="4" fill="#febc2e"/>
    <circle cx="46" cy="17" r="4" fill="#28c840"/>
    <text x="16" y="42" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#8fd18f">$ blastn -query g1.fna -db fimA_refs …</text>
    <text x="16" y="58" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#8fd18f">$ python parse_mfa.py g1.out &gt; g1.mfa</text>
    <text x="16" y="74" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#d9b38c">$ # …repeat per scheme, per genome</text>
  </g>

  <text x="60" y="474" font-size="12.5" fill="#6b6058">Reference alleles scattered across</text>
  <text x="60" y="492" font-size="12.5" fill="#6b6058">three decades of publications; a</text>
  <text x="60" y="510" font-size="12.5" fill="#6b6058">bespoke script per scheme, per genome.</text>

  <!-- E. coli / Strep / Staph note -->
  <g transform="translate(60,534)">
    <rect width="322" height="60" rx="7" fill="#F4EFE6" stroke="#e0d5c8" stroke-width="1.2"/>
    <text x="14" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">WHY Pg IS LEFT OUT</text>
    <text x="14" y="39" font-size="10" fill="#6b6058">Generic typing platforms are built around</text>
    <text x="14" y="52" font-size="10" fill="#6b6058">
      <tspan font-style="italic">E. coli</tspan>, streptococci and staphylococci.
      <tspan font-style="italic"> P. gingivalis</tspan> is in none.</text>
  </g>

  <!-- ============ ARROW / TOOL ============ -->
  <g transform="translate(430,212)">
    <!-- gear + bacterium mark -->
    <circle cx="80" cy="58" r="58" fill="#F4EFE6" stroke="#EADFCF" stroke-width="3"/>
    <g transform="translate(80,58) scale(0.66)">
      <!-- simplified gear -->
      <path fill="url(#gearGrad)" stroke="#2A1B1F" stroke-width="3" stroke-linejoin="round"
        d="M -6,-46 h 12 l 3,15 12,3 12,-9 9,6 -3,15 10,7 14,-4 7,9 -9,12 7,11 14,2 v 12 l -14,2 -7,11 9,12 -7,9 -14,-4 -10,7 3,15 -9,6 -12,-9 -12,3 -3,15 h -12 l -3,-15 -12,-3 -12,9 -9,-6 3,-15 -10,-7 -14,4 -7,-9 9,-12 -7,-11 -14,-2 v -12 l 14,-2 7,-11 -9,-12 7,-9 14,4 10,-7 -3,-15 9,-6 12,9 12,-3 z"/>
      <circle cx="0" cy="0" r="30" fill="#FFFDF9" stroke="#2A1B1F" stroke-width="3"/>
      <!-- tiny bacterium -->
      <g transform="rotate(-24)">
        <rect x="-17" y="-9" width="34" height="18" rx="9" fill="url(#bactGrad)" stroke="#2A1B1F" stroke-width="2.4"/>
        <circle cx="-6" cy="-2" r="2.6" fill="#2A1B1F"/>
        <circle cx="6" cy="-2" r="2.6" fill="#2A1B1F"/>
        <path d="M -5 4 q 5 4 10 0" fill="none" stroke="#2A1B1F" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
    <text x="80" y="164" text-anchor="middle" font-size="26" font-weight="700" fill="#E63F25">gingi<tspan fill="#DE7226">CHARM</tspan></text>
    <text x="80" y="186" text-anchor="middle" font-size="10" fill="#8a7f76">one genome in</text>
    <text x="80" y="201" text-anchor="middle" font-size="10" fill="#8a7f76">full description out</text>
  </g>

  <!-- arrows in / out -->
  <line x1="392" y1="270" x2="440" y2="270" stroke="#E63F25" stroke-width="3.5" marker-end="url(#arrowBrand)"/>
  <line x1="580" y1="270" x2="640" y2="270" stroke="#E63F25" stroke-width="3.5" marker-end="url(#arrowBrand)"/>

  <!-- ============ RIGHT: THE OUTPUT ============ -->
  <text x="660" y="52" font-size="13" font-weight="700" fill="#a09488" letter-spacing="1.6">gingiCHARM OUTPUT · &lt; 1 MIN</text>
  <line x1="660" y1="64" x2="1140" y2="64" stroke="#e6ded4" stroke-width="2"/>

  <!-- genome input chip -->
  <g transform="translate(660,84)">
    <rect width="480" height="46" rx="8" fill="#fff" stroke="#d9cec2" stroke-width="1.5"/>
    <text x="16" y="21" font-size="10" font-weight="700" fill="#8a7f76">INPUT</text>
    <text x="16" y="36" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#486B5A">my_isolate.fna</text>
    <text x="330" y="30" font-size="10.5" fill="#a09488">assembly · contigs · CDS</text>
  </g>

  <!-- results cards -->
  <g font-size="11">
    <!-- fimA -->
    <g transform="translate(660,146)">
      <rect width="232" height="62" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
      <rect width="5" height="62" rx="2" fill="#B85C43"/>
      <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">fimA TYPE</text>
      <text x="18" y="46" font-size="20" font-weight="700" fill="#2A1B1F">I</text>
      <text x="46" y="46" font-size="10" fill="#a09488">100% id / 100% cov</text>
    </g>
    <!-- rag -->
    <g transform="translate(908,146)">
      <rect width="232" height="62" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
      <rect width="5" height="62" rx="2" fill="#CBB175"/>
      <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">rag TYPE</text>
      <text x="18" y="46" font-size="20" font-weight="700" fill="#2A1B1F">rag-4</text>
      <text x="86" y="46" font-size="10" fill="#a09488">ragB-supported</text>
    </g>
    <!-- mfa operon -->
    <g transform="translate(660,220)">
      <rect width="480" height="66" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
      <rect width="5" height="66" rx="2" fill="#486B5A"/>
      <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">mfa OPERON PROFILE</text>
      <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700">
        <text x="18"  y="48" fill="#2A1B1F">70A</text>
        <text x="62"  y="48" fill="#c9bdaf">/</text>
        <text x="80"  y="48" fill="#2A1B1F">70</text>
        <text x="112" y="48" fill="#c9bdaf">/</text>
        <text x="130" y="48" fill="#2A1B1F">70</text>
        <text x="162" y="48" fill="#c9bdaf">/</text>
        <text x="180" y="48" fill="#2A1B1F">70</text>
        <text x="212" y="48" fill="#c9bdaf">/</text>
        <text x="230" y="48" fill="#2A1B1F">A1</text>
      </g>
      <g font-size="8.5" fill="#a09488">
        <text x="18"  y="60">mfa1</text>
        <text x="80"  y="60">mfa2</text>
        <text x="130" y="60">mfa3</text>
        <text x="180" y="60">mfa4</text>
        <text x="230" y="60">mfa5</text>
      </g>
      <text x="300" y="42" font-size="9.5" fill="#73A38B">✓ mfa1–4 co-segregate</text>
      <text x="300" y="56" font-size="9.5" fill="#a09488">all five components typed</text>
    </g>
    <!-- K antigen -->
    <g transform="translate(660,298)">
      <rect width="232" height="62" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
      <rect width="5" height="62" rx="2" fill="#F39C12"/>
      <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">K-ANTIGEN</text>
      <text x="18" y="46" font-size="20" font-weight="700" fill="#2A1B1F">K−</text>
      <text x="62" y="46" font-size="10" fill="#a09488">non-encapsulated</text>
    </g>
    <!-- VF -->
    <g transform="translate(908,298)">
      <rect width="232" height="62" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
      <rect width="5" height="62" rx="2" fill="#803348"/>
      <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">VIRULENCE FACTORS</text>
      <text x="18" y="46" font-size="20" font-weight="700" fill="#2A1B1F">147</text>
      <text x="68" y="46" font-size="10" fill="#a09488">/ 154 families detected</text>
    </g>
  </g>

  <!-- functional categories strip -->
  <g transform="translate(660,374)">
    <rect width="480" height="112" rx="8" fill="#fff" stroke="#e0d5c8" stroke-width="1.4" filter="url(#soft)"/>
    <rect width="5" height="112" rx="2" fill="#667eea"/>
    <text x="18" y="22" font-size="10.5" font-weight="700" fill="#8a7f76">FUNCTIONAL CATEGORIES · every gene labelled</text>
    <!-- stacked bar -->
    <g transform="translate(18,32)">
      <rect x="0"   y="0" width="88"  height="17" fill="#73A38B"/>
      <rect x="88"  y="0" width="70"  height="17" fill="#486B5A"/>
      <rect x="158" y="0" width="52"  height="17" fill="#CBB175"/>
      <rect x="210" y="0" width="44"  height="17" fill="#B85C43"/>
      <rect x="254" y="0" width="38"  height="17" fill="#803348"/>
      <rect x="292" y="0" width="34"  height="17" fill="#DE7226"/>
      <rect x="326" y="0" width="30"  height="17" fill="#E63F25"/>
      <rect x="356" y="0" width="26"  height="17" fill="#667eea"/>
      <rect x="382" y="0" width="24"  height="17" fill="#764ba2"/>
      <rect x="406" y="0" width="38"  height="17" fill="#c9bdaf"/>
    </g>
    <g font-size="8.6" fill="#6b6058">
      <text x="18"  y="68">Metabolic</text>
      <text x="104" y="68">Genetic info</text>
      <text x="186" y="68">Envelope</text>
      <text x="252" y="68">Surface</text>
      <text x="312" y="68">Secretion</text>
      <text x="382" y="68">Heme/Fe</text>
    </g>
    <text x="18" y="90" font-size="10.5" fill="#6b6058">Ten organism-relevant classes cover the whole genome —</text>
    <text x="18" y="104" font-size="10.5" fill="#6b6058">GO and KEGG annotate fewer than half of it.</text>
  </g>

  <!-- access routes -->
  <g transform="translate(660,500)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#8a7f76">THREE WAYS TO RUN IT</text>
    <g transform="translate(0,12)">
      <rect width="150" height="42" rx="7" fill="#F4EFE6" stroke="#e0d5c8" stroke-width="1.2"/>
      <text x="14" y="18" font-size="10.5" font-weight="700" fill="#486B5A">Command line</text>
      <text x="14" y="33" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9" fill="#8a7f76">fimtyping g.fna</text>
    </g>
    <g transform="translate(164,12)">
      <rect width="150" height="42" rx="7" fill="#F4EFE6" stroke="#e0d5c8" stroke-width="1.2"/>
      <text x="14" y="18" font-size="10.5" font-weight="700" fill="#486B5A">Python API</text>
      <text x="14" y="33" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9" fill="#8a7f76">import fimtyping</text>
    </g>
    <g transform="translate(328,12)">
      <rect width="152" height="42" rx="7" fill="#F4EFE6" stroke="#e0d5c8" stroke-width="1.2"/>
      <text x="14" y="18" font-size="10.5" font-weight="700" fill="#486B5A">Browser GUI</text>
      <text x="14" y="33" font-size="9" fill="#8a7f76">upload · tick · run</text>
    </g>
  </g>

  <!-- footer strip -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#e6ded4" stroke-width="1.5"/>
  <text x="60" y="614" font-size="10" fill="#a09488">
    3,388 curated records · 5 complete reference genomes · 154 virulence-factor families · 4 typing schemes, every published allele
  </text>
</svg>
